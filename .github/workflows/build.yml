name: Build Flutter APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          
      - name: Generate Android files and Build
        run: |
          # Переименовываем папку "библиотека" обратно в "lib", если она так называется
          if [ -d "библиотека" ]; then mv "библиотека" lib; fi
          
          # Создаем недостающие системные папки (android, ios) на основе нашего pubspec.yaml
          flutter create . --project-name rang_shop
          
          # Скачиваем зависимости
          flutter pub get
          
          # Собираем APK
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RangShop-APK
          path: build/app/outputs/flutter-apk/app-release.apk
