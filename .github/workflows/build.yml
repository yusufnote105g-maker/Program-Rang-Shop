name: Build Flutter APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          
      - name: Fix folders and Build
        run: |
          # 1. Удаляем папку, если браузер назвал её "библиотека"
          if [ -d "библиотека" ]; then rm -rf "библиотека"; fi

          # 2. Создаем правильную структуру папок (на всякий случай)
          mkdir -p lib/core/utils lib/core/theme
          mkdir -p lib/features/auth/data lib/features/auth/domain
          mkdir -p lib/features/auth/presentation/bloc lib/features/auth/presentation/screens

          # 3. Ищем файлы во ВСЕХ папках и перемещаем в нужные места
          # (Если файла нет, команда не вызовет ошибку благодаря || true)
          
          find . -type f -name "price_formatter.dart" -exec mv {} lib/core/utils/ \; || true
          find . -type f -name "app_theme.dart" -exec mv {} lib/core/theme/ \; || true
          find . -type f -name "auth_repository.dart" -exec mv {} lib/features/auth/domain/ \; || true
          find . -type f -name "mock_auth_repository.dart" -exec mv {} lib/features/auth/data/ \; || true
          find . -type f -name "auth_form_state.dart" -exec mv {} lib/features/auth/presentation/bloc/ \; || true
          find . -type f -name "auth_cubit.dart" -exec mv {} lib/features/auth/presentation/bloc/ \; || true
          find . -type f -name "auth_screen.dart" -exec mv {} lib/features/auth/presentation/screens/ \; || true

          # 4. Проверяем, что main.dart лежит там, где надо
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi
          
          # 5. Генерируем Android файлы и собираем
          flutter create . --project-name rang_shop
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RangShop-APK
          path: build/app/outputs/flutter-apk/app-release.apk
