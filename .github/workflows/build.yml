name: Build APK


on:
  workflow_dispatch:
  push:
    branches: [main, master]


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4


      - name: Проверить, что в репозитории именно наш код
        run: |
          echo "Коммит: $GITHUB_SHA"
          ls -la
          test -f pubspec.yaml || { echo "::error::Нет pubspec.yaml в корне репозитория"; exit 1; }
          test -f lib/main.dart || { echo "::error::Нет lib/main.dart (папка должна называться lib)"; exit 1; }
          grep -q "RangShopApp" lib/main.dart || { echo "::error::lib/main.dart не наш: в нём нет RangShopApp"; exit 1; }
          echo "--- первые строки lib/main.dart ---"
          head -n 15 lib/main.dart
          echo "--- файлы в lib ---"
          ls -R lib


      - name: Сохранить копию lib и pubspec.yaml
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          cp -a lib "$RUNNER_TEMP/backup/lib"
          cp -a pubspec.yaml "$RUNNER_TEMP/backup/pubspec.yaml"


      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'


      - name: Создать папку android, если её нет
        run: |
          if [ -d android ]; then
            echo "Папка android уже есть, flutter create не нужен"
          else
            flutter create . --platforms=android --project-name rang_shop
          fi
          rm -rf test


      - name: Вернуть наш код, если flutter create что-то изменил
        run: |
          if ! diff -r "$RUNNER_TEMP/backup/lib" lib > /dev/null; then
            echo "::warning::flutter create изменил папку lib. Возвращаем наш код."
            rm -rf lib
            cp -a "$RUNNER_TEMP/backup/lib" lib
          fi
          if ! cmp -s "$RUNNER_TEMP/backup/pubspec.yaml" pubspec.yaml; then
            echo "::warning::flutter create изменил pubspec.yaml. Возвращаем наш."
            cp -a "$RUNNER_TEMP/backup/pubspec.yaml" pubspec.yaml
          fi
          diff -r "$RUNNER_TEMP/backup/lib" lib
          grep -q "RangShopApp" lib/main.dart
          echo "OK: lib и pubspec.yaml совпадают с репозиторием"


      - name: Очистить кэш (на всякий случай)
        run: flutter clean


      - name: Загрузить зависимости
        run: flutter pub get


      - name: Анализ кода (не блокирует сборку)
        run: flutter analyze
        continue-on-error: true


      - name: Собрать APK
        run: flutter build apk --debug -t lib/main.dart


      - name: Проверить, что в APK наше приложение
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          ls -lh "$APK"
          if unzip -p "$APK" assets/flutter_assets/kernel_blob.bin | grep -aq "RangShopApp"; then
            echo "OK: в APK найден RangShopApp"
          else
            echo "::warning::RangShopApp в APK не найден"
          fi


      - name: Выгрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: rang-shop-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
